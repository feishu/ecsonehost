name: Android CI

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to build from'
        required: true
        default: 'sso' # 您可以将其更改为默认的主分支名称

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch_name }}

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      run: |
        echo "${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release.jks
      shell: bash

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      working-directory: ${{ github.workspace }}

    - name: Build with Gradle
      env:
        ANDROID_SIGNING_KEY_STORE_FILE: ${{ github.workspace }}/app/release.jks
        ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: ./gradlew assembleRelease
      working-directory: ${{ github.workspace }}

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release-signed-apk
        path: ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error