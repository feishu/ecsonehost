apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 27
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.lzx.ecsoneqnr"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName "1.0.11"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
        manifestPlaceholders = [
                XG_ACCESS_ID:"2100231275",
                XG_ACCESS_KEY : "ALQ2WM1U152E",
                HW_APPID: "",
                OPPO_appKey:"",
                OPPO_appSecret:"",
                Mi_APP_ID:"",
                Mi_APP_KEY:"",
                MZ_APP_ID:"",
                MZ_APP_KEY:"",
                VIVO_APP_ID:"",
                VIVO_APP_KEY:""
        ]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/atomicfu.kotlin_module'
    }
}


kotlin {
    experimental {
        coroutines 'enable'
    }
}

dependencies {
    api ('com.github.aygtech:weexbox-android-library:2.2.0'){
//        exclude group: 'com.alibaba', module: 'fastjson'
    }

    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    implementation project(':BTModule')
    implementation project(':WeexChartLib')
    implementation project(':weexextra')
    implementation project(':Qrcode')
    implementation project(':NFCModule')
    implementation project(':WEImage')
    implementation project(':TslNet')
    implementation project(':leancloud')
    implementation project(':PushCenterLib')
}

