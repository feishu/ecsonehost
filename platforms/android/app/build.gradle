apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'net.linguica.maven-settings'

repositories {
    maven {
        url 'https://pkgs.dev.azure.com/eBest-IOT-DEV/Product-Development/_packaging/VisionSDKAndroid/maven/v1'
        name 'VisionSDKAndroid'
        authentication {
            basic(BasicAuthentication)
        }
    }
}

android {
    compileSdkVersion 31
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.lzx.ecsone"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 53
        versionName "3.0.10"
        ndk {
            abiFilters "armeabi-v7a", "x86_64" //, "arm64-v8a"//"x86"
        }
        manifestPlaceholders = [
                XG_ACCESS_ID:"2100346790",
                XG_ACCESS_KEY : "A1BH437RMG6H",
                HW_APPID: "",
                OPPO_appKey:"",
                OPPO_appSecret:"",
                Mi_APP_ID:"",
                Mi_APP_KEY:"",
                MZ_APP_ID:"",
                MZ_APP_KEY:"",
                VIVO_APP_ID:"",
                VIVO_APP_KEY:""
        ]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/atomicfu.kotlin_module'
        exclude 'META-INF/com.android.tools/proguard/coroutines.pro'
        pickFirst 'okhttp3/internal/publicsuffix/publicsuffixes.gz'
        pickFirst 'META-INF/retrofit.kotlin_module'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}


kotlin {
    experimental {
        coroutines 'enable'
    }
}

dependencies {
    api ('com.github.aygtech:weexbox-android-library:2.2.0'){
//        exclude group: 'com.alibaba', module: 'fastjson'
    }

    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    api 'com.lelibrary.androidlelibrary:visioniot:9.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.github.azhon:AppUpdate:4.0.0'
    implementation 'com.beust:klaxon:5.5'
    implementation project(':BTModule')
    implementation project(':WeexChartLib')
    implementation project(':weexextra')
    implementation project(':Qrcode')
    implementation project(':NFCModule')
    implementation project(':WEImage')
    implementation project(':TslNet')
    implementation project(':OSSModule')
//    implementation project(':leancloud')
    implementation project(':PushCenterLib')
}

