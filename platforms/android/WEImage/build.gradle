apply plugin: 'com.android.library'

android {
    compileSdkVersion 27



    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 27

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:27.1.1'
//    testCompile 'junit:junit:4.12'
//    androidTestCompile 'com.android.support.test:runner:1.0.1'
//    androidTestCompile 'com.android.support.test.espresso:espresso-core:3.0.1'
    implementation "com.android.support:recyclerview-v7:27.1.1"

    //rxjava
    compileOnly 'io.reactivex.rxjava2:rxjava:2.1.12'
    compileOnly 'io.reactivex.rxjava2:rxandroid:2.0.2'

    api 'com.github.ybq:Android-SpinKit:1.2.0'
    compileOnly "${project.TeslaWeexSDK}"
    compileOnly project(':weexextra')
    compileOnly "com.alibaba:fastjson:${project.fastjsonLibVersion}"
    compileOnly 'com.yanzhenjie:permission:1.1.2'
    implementation 'com.github.chrisbanes.photoview:library:1.2.4'
    compileOnly 'com.github.bumptech.glide:glide:3.7.0'
}
