// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        maven { url 'http://maven.aliyun.com/nexus/content/groups/public/' }
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.3.11"
        classpath "io.realm:realm-gradle-plugin:5.3.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
//        maven { url "http://192.168.0.121:8081/repository/maven-releases/" }
        google()
        maven { url 'http://maven.aliyun.com/nexus/content/groups/public/' }
        jcenter()
        maven { url "https://jitpack.io" }
    }
}

subprojects {
    ext {
        kotlin_version = '1.2.21'
        fastjsonLibVersion = "1.1.70.android"
        weexSDKVersion = "0.18.0-beta-3"
        TeslaWeexSDK = "com.taobao.android:weex_sdk:0.24.0"
    }
}

ext {
    sdkVersion = "5.0.18"
    supportLibVersion = "26.1.0"
    fastjsonVersion = "1.1.70.android"
    converterVersion = "2.1.0"
    rxandroidVersion = "2.1.0"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
